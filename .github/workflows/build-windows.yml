name: Build Windows x64 (RadiAnt UX Edition)

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt 5.15.2
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: 'win64_msvc2019_64'
        cache: true

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Cache ITK
      id: cache-itk
      uses: actions/cache@v4
      with:
        path: ${{ runner.workspace }}/itk-install
        key: ${{ runner.os }}-itk-5.3.0-modular-msvc2022-v5

    - name: Build Modular ITK (if not cached)
      shell: pwsh
      run: |
        $ws = "${{ runner.workspace }}".Replace('\', '/')
        $itkConfigFile = Get-ChildItem -Path "$ws/itk-install" -Filter "ITKConfig.cmake" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($itkConfigFile) {
            Write-Output ">> ITK disponivel e valido em: $($itkConfigFile.FullName)"
            exit 0
        }
        Write-Output ">> ITK nao encontrado. Iniciando compilacao do ITK 5.3..."
        New-Item -ItemType Directory -Path "$ws/itk-build" -Force | Out-Null
        Set-Location "$ws"
        if (-not (Test-Path "$ws/itk-src")) {
            git clone --depth 1 --branch v5.3.0 https://github.com/InsightSoftwareConsortium/ITK.git itk-src
        }
        Set-Location "$ws/itk-build"
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_EXAMPLES=OFF `
          -DBUILD_TESTING=OFF `
          -DITK_BUILD_DEFAULT_MODULES=OFF `
          -DModule_ITKEigen3=ON `
          -DModule_ITKCommon=ON `
          -DModule_ITKImageFilterBase=ON `
          -DModule_ITKImageFunction=ON `
          -DModule_ITKImageGrid=ON `
          -DModule_ITKImageIntensity=ON `
          -DModule_ITKSpatialObjects=ON `
          -DModule_ITKStatistics=ON `
          -DModule_ITKTransform=ON `
          -DCMAKE_INSTALL_PREFIX="$ws/itk-install" `
          ../itk-src
        cmake --build . --config Release --target install --parallel 4

    - name: Configure Aliza MS
      shell: pwsh
      run: |
        $ws = "${{ runner.workspace }}".Replace('\', '/')
        
        $itkFile = Get-ChildItem -Path "$ws" -Filter "ITKConfig.cmake" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $itkFile) {
            Write-Error "ITKConfig.cmake nao encontrado no workspace!"
            exit 1
        }
        $itkDir = $itkFile.DirectoryName.Replace('\', '/')
        Write-Output ">> ITK configurado em: $itkDir"

        $qtRoot = "$env:QT_ROOT_DIR".Replace('\', '/')
        $qt5Dir = "$qtRoot/lib/cmake/Qt5"
        Write-Output ">> Qt5 configurado em: $qt5Dir"

        New-Item -ItemType Directory -Path build -Force | Out-Null
        Set-Location build
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DALIZA_QT_VERSION=5 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$qtRoot;$qtRoot/lib/cmake" `
          -DQt5_DIR="$qt5Dir" `
          -DITK_DIR="$itkDir" `
          .. *>&1 | Tee-Object -FilePath "../cmake_config.log"
        if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configure falhou com codigo $LASTEXITCODE"
            exit $LASTEXITCODE
        }

    - name: Upload Configure Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cmake-configure-logs
        path: |
          cmake_config.log
          build/CMakeFiles/CMakeOutput.log
          build/CMakeFiles/CMakeError.log

    - name: Build Aliza MS
      shell: pwsh
      run: |
        cmake --build build --config Release --parallel 4 *>&1 | Tee-Object -FilePath "cmake_build.log"
        if ($LASTEXITCODE -ne 0) {
            Write-Error "Compilacao do Aliza MS falhou com codigo $LASTEXITCODE"
            exit $LASTEXITCODE
        }

    - name: Upload Build Failure Logs
      if: failure() && hashFiles('cmake_build.log') != ''
      uses: actions/upload-artifact@v4
      with:
        name: msvc-build-logs
        path: cmake_build.log

    - name: Package Artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path package -Force | Out-Null
        $exeFile = Get-ChildItem -Path build -Filter "*aliza*.exe" -Recurse | Select-Object -First 1
        if (-not $exeFile) {
            Write-Error "Executavel aliza*.exe nao encontrado apos compilacao!"
            exit 1
        }
        Write-Output ">> Encontrado executavel em: $($exeFile.FullName)"
        Copy-Item $exeFile.FullName -Destination package/aliza.exe
        Copy-Item $exeFile.FullName -Destination package/alizams.exe
        if (Test-Path "GUI/dark_radiant.qss") {
            Copy-Item "GUI/dark_radiant.qss" -Destination package/
        }
        windeployqt package/aliza.exe --no-translations --compiler-runtime
        7z a aliza-radiant-windows-x64.zip ./package/*

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aliza-radiant-windows-x64
        path: aliza-radiant-windows-x64.zip
